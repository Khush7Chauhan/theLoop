[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "the-loop"
version = "0.1.0"
description = "A tiny policy-guarded coding-agent loop."
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = ["loop"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker daemon and the the-loop-sandbox image",
]
